# nginx server blocks for the site. Certificates via certbot or acme.sh.
# Adjust the certificate paths if yours differ, copy the site to /srv/site,
# then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name gureet.ca www.gureet.ca;
    return 301 https://gureet.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx 1.25.1+; older versions use "listen 443 ssl http2"
    server_name gureet.ca;

    ssl_certificate     /etc/letsencrypt/live/gureet.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gureet.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /srv/site;
    index index.html;
    error_page 404 /404.html;

    # Careful: any add_header inside a location block drops ALL of these for that
    # location. That's why the font cache rule below uses `expires` instead.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/fonts/ {
        expires 1y;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
}
